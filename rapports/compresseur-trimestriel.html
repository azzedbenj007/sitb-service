<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Rapport préventif compresseur | SITB</title>
<style>
  :root {
    --fond: #0b1220; --panneau: #121c2f; --champ: #0e1728; --bord: #27364f;
    --texte: #e8eef8; --doux: #9fb0c8; --bleu: #2f8cff; --bleu-fort: #62a9ff;
    --vert: #1fa971; --rouge: #e5484d; --ambre: #f0b429;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--fond); color: var(--texte); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; padding-bottom: 150px; }
  header { padding: 22px 16px 14px; max-width: 860px; margin: 0 auto; }
  .surtitre { color: var(--bleu-fort); font-size: 13px; font-weight: 600; letter-spacing: .04em; }
  h1 { font-size: 24px; line-height: 1.2; margin: 4px 0 6px; }
  header p { margin: 0; color: var(--doux); font-size: 15px; }
  main { max-width: 860px; margin: 0 auto; padding: 0 16px; }
  section { background: var(--panneau); border: 1px solid var(--bord); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  h2 { font-size: 17px; margin: 0 0 12px; }
  .grille { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .large { grid-column: 1 / -1; }
  label.champ { display: block; font-size: 14px; color: var(--doux); }
  input, select, textarea { width: 100%; margin-top: 4px; min-height: 44px; padding: 9px 10px; background: var(--champ); color: var(--texte); border: 1px solid var(--bord); border-radius: 7px; font: inherit; color-scheme: dark; }
  input[readonly] { color: var(--doux); }
  textarea { min-height: 76px; resize: vertical; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--bleu); outline-offset: 1px; }
  .invalide { border-color: var(--rouge) !important; }
  .cases { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .case { display: flex; gap: 9px; align-items: center; min-height: 44px; padding: 8px 10px; background: var(--champ); border: 1px solid var(--bord); border-radius: 7px; font-size: 15px; }
  .case input { width: 20px; height: 20px; min-height: 0; margin: 0; flex: none; accent-color: var(--bleu); }
  .operation { padding: 12px 0; border-top: 1px solid var(--bord); }
  .operation:first-of-type { border-top: 0; padding-top: 0; }
  .ligne-op { display: flex; gap: 12px; justify-content: space-between; align-items: center; }
  .libelle { font-size: 15px; }
  .choix { display: flex; flex: none; border: 1px solid var(--bord); border-radius: 7px; overflow: hidden; }
  .choix button { min-height: 44px; min-width: 76px; padding: 0 10px; border: 0; background: var(--champ); color: var(--doux); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  .choix button + button { border-left: 1px solid var(--bord); }
  .choix button[aria-pressed="true"].fait { background: var(--vert); color: #06140e; }
  .choix button[aria-pressed="true"].non { background: var(--rouge); color: #fff; }
  .operation.a-revoir .choix { border-color: var(--rouge); }
  .operation input { margin-top: 9px; }
  .piece { display: grid; grid-template-columns: minmax(0, 1fr) 84px minmax(0, 1fr) 44px; gap: 8px; margin-bottom: 8px; align-items: end; }
  .piece input { margin-top: 0; }
  .retirer { min-height: 44px; border: 1px solid var(--bord); border-radius: 7px; background: var(--champ); color: var(--doux); font-size: 20px; cursor: pointer; }
  .secondaire { min-height: 44px; padding: 0 14px; border: 1px solid var(--bord); border-radius: 7px; background: transparent; color: var(--bleu-fort); font: inherit; font-weight: 600; cursor: pointer; }
  #barre { position: fixed; left: 0; right: 0; bottom: 0; background: #0a101ddd; backdrop-filter: blur(6px); border-top: 1px solid var(--bord); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .barre-int { max-width: 828px; margin: 0 auto; }
  .avancement { display: flex; justify-content: space-between; font-size: 13px; color: var(--doux); margin-bottom: 6px; gap: 12px; }
  .jauge { height: 5px; background: var(--bord); border-radius: 3px; overflow: hidden; margin-bottom: 9px; }
  .jauge div { height: 100%; width: 0; background: var(--bleu); transition: width .15s; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .actions button { min-height: 48px; border-radius: 7px; border: 1px solid var(--bleu); font: inherit; font-weight: 700; cursor: pointer; }
  #btn-pdf { background: var(--bleu); color: #04101f; }
  #btn-imprimer { background: transparent; color: var(--bleu-fort); }
  .actions button:disabled { opacity: .55; cursor: wait; }
  #message { max-width: 828px; margin: 0 auto 14px; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--bord); background: var(--panneau); font-size: 15px; }
  #message[hidden] { display: none; }
  #message.erreur { border-color: var(--rouge); }
  #message.succes { border-color: var(--vert); }
  #message ul { margin: 6px 0 0; padding-left: 20px; }
  #chargement { color: var(--doux); }
  @media (max-width: 620px) {
    .grille, .cases { grid-template-columns: minmax(0, 1fr); }
    .ligne-op { flex-direction: column; align-items: stretch; gap: 8px; }
    .choix button { flex: 1; }
    .piece { grid-template-columns: minmax(0, 1fr) 84px; }
    .piece .remarque { grid-column: 1 / 2; }
  }
</style>
</head>
<body>
<header>
  <div class="surtitre">SITB · Fluides médicaux</div>
  <h1>Rapport préventif trimestriel : air comprimé</h1>
  <p id="sous-titre">Compresseurs, sécheurs, réservoirs et local</p>
</header>
<main>
  <div id="message" role="status" aria-live="polite" hidden></div>
  <form id="form" novalidate hidden>
    <section>
      <h2>Informations générales</h2>
      <div class="grille">
        <label class="champ">Client<input id="client" readonly></label>
        <label class="champ">Marché N°<input id="marche" autocomplete="off" required></label>
        <label class="champ">Société<input id="societe" required></label>
        <label class="champ">Intervenant(s)<input id="intervenants" required></label>
        <label class="champ">Chargé de suivi<input id="charge_suivi" required></label>
        <label class="champ">Date d'intervention<input id="date" type="date" required></label>
        <label class="champ">Heure de début<input id="heure_debut" type="time" required></label>
        <label class="champ">Heure de fin<input id="heure_fin" type="time" required></label>
        <label class="champ">Trimestre
          <select id="trimestre" required><option value="T1">T1</option><option value="T2">T2</option><option value="T3">T3</option><option value="T4">T4</option></select>
        </label>
        <label class="champ">Année<input id="annee" inputmode="numeric" maxlength="4" required></label>
        <label class="champ large">État fonctionnel
          <select id="etat" required><option value="">Choisir</option><option>En service</option><option>En panne</option></select>
        </label>
      </div>
    </section>
    <section>
      <h2>Articles concernés</h2>
      <div class="cases" id="articles"></div>
    </section>
    <div id="sections"></div>
    <section>
      <h2>Pièces détachées changées</h2>
      <div id="pieces"></div>
      <button type="button" class="secondaire" id="ajout-piece">Ajouter une pièce</button>
    </section>
    <section>
      <h2>Conclusion</h2>
      <div class="grille">
        <label class="champ large">Résultat de l'intervention<select id="resultat" required></select></label>
        <label class="champ large">Observation<textarea id="observation" maxlength="1500"></textarea></label>
      </div>
    </section>
    <button type="button" class="secondaire" id="nouveau">Nouveau rapport</button>
  </form>
  <p id="chargement">Chargement du modèle…</p>
</main>
<div id="barre">
  <div class="barre-int">
    <div class="avancement"><span id="compteur">0 opération</span><span id="etat-envoi">Brouillon sauvegardé</span></div>
    <div class="jauge"><div id="jauge"></div></div>
    <div class="actions">
      <button type="button" id="btn-pdf">Générer le PDF</button>
      <button type="button" id="btn-imprimer">Imprimer</button>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';
  var BASE = 'https://n8n.srv881398.hstgr.cloud/webhook/rapport-compresseur';
  var CLE_BROUILLON = 'sitb_rp_ac_tri_brouillon_v1';
  var CLE_MODELE = 'sitb_rp_ac_tri_modele_v1';
  var CHAMPS = ['marche', 'societe', 'intervenants', 'charge_suivi', 'date', 'heure_debut', 'heure_fin', 'trimestre', 'annee', 'etat', 'resultat', 'observation'];
  var modele = null, totalOps = 0, dernier = null, enCours = false;
  var etat = { operations: {}, articles: [], pieces: [] };

  function $(id) { return document.getElementById(id); }
  function lire(cle) { try { return JSON.parse(localStorage.getItem(cle)); } catch (e) { return null; } }
  function ecrire(cle, v) { try { localStorage.setItem(cle, JSON.stringify(v)); } catch (e) {} }
  function effacer(cle) { try { localStorage.removeItem(cle); } catch (e) {} }

  function message(type, titre, liste) {
    var m = $('message');
    m.className = type || '';
    m.textContent = titre;
    if (liste && liste.length) {
      var ul = document.createElement('ul');
      liste.forEach(function (x) { var li = document.createElement('li'); li.textContent = x; ul.appendChild(li); });
      m.appendChild(ul);
    }
    m.hidden = false;
    if (type === 'erreur') m.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function trimestreDe(d) { return 'T' + (Math.floor((parseInt(d.slice(5, 7), 10) - 1) / 3) + 1); }
  function aujourdhui() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function construire() {
    $('sous-titre').textContent = modele.sous_titre;
    $('client').value = modele.client;
    var articles = $('articles'); articles.textContent = '';
    modele.articles.forEach(function (a) {
      var l = document.createElement('label'); l.className = 'case';
      var c = document.createElement('input'); c.type = 'checkbox'; c.value = a;
      c.checked = etat.articles.indexOf(a) >= 0;
      c.addEventListener('change', function () {
        etat.articles = Array.prototype.slice.call(articles.querySelectorAll('input:checked')).map(function (x) { return x.value; });
        modifie();
      });
      l.appendChild(c); l.appendChild(document.createTextNode(a)); articles.appendChild(l);
    });
    var res = $('resultat'); res.textContent = '';
    var vide = document.createElement('option'); vide.value = ''; vide.textContent = 'Choisir'; res.appendChild(vide);
    modele.resultats.forEach(function (r) { var o = document.createElement('option'); o.textContent = r; res.appendChild(o); });

    var conteneur = $('sections'); conteneur.textContent = ''; totalOps = 0;
    modele.sections.forEach(function (s) {
      var sec = document.createElement('section');
      var h = document.createElement('h2'); h.textContent = s.titre; sec.appendChild(h);
      s.operations.forEach(function (o) { totalOps += 1; sec.appendChild(ligneOperation(o)); });
      conteneur.appendChild(sec);
    });
    afficherPieces();
  }

  function ligneOperation(o) {
    var r = etat.operations[o.id] || (etat.operations[o.id] = { statut: '', remarque: '' });
    var div = document.createElement('div'); div.className = 'operation'; div.id = 'ligne-' + o.id;
    var ligne = document.createElement('div'); ligne.className = 'ligne-op';
    var t = document.createElement('div'); t.className = 'libelle'; t.textContent = o.libelle;
    var choix = document.createElement('div'); choix.className = 'choix'; choix.setAttribute('role', 'group'); choix.setAttribute('aria-label', o.libelle);
    var bf = bouton('Fait', 'fait'), bn = bouton('Non fait', 'non');
    var rem = document.createElement('input'); rem.placeholder = 'Défaillance constatée / remarque'; rem.maxLength = 400; rem.value = r.remarque || '';
    rem.setAttribute('aria-label', 'Remarque : ' + o.libelle);
    function maj() {
      bf.setAttribute('aria-pressed', r.statut === 'fait'); bn.setAttribute('aria-pressed', r.statut === 'non_fait');
      rem.placeholder = r.statut === 'non_fait' ? 'Motif obligatoire' : 'Défaillance constatée / remarque';
    }
    function choisir(s) { r.statut = r.statut === s ? '' : s; div.classList.remove('a-revoir'); rem.classList.remove('invalide'); maj(); modifie(); }
    bf.addEventListener('click', function () { choisir('fait'); });
    bn.addEventListener('click', function () { choisir('non_fait'); });
    rem.addEventListener('input', function () { r.remarque = rem.value; rem.classList.remove('invalide'); modifie(); });
    choix.appendChild(bf); choix.appendChild(bn); ligne.appendChild(t); ligne.appendChild(choix);
    div.appendChild(ligne); div.appendChild(rem); maj();
    return div;
  }
  function bouton(texte, classe) {
    var b = document.createElement('button'); b.type = 'button'; b.textContent = texte; b.className = classe; b.setAttribute('aria-pressed', 'false'); return b;
  }

  function afficherPieces() {
    var c = $('pieces'); c.textContent = '';
    etat.pieces.forEach(function (p, i) {
      var d = document.createElement('div'); d.className = 'piece';
      d.appendChild(champPiece(p, 'designation', 'Désignation', 'text'));
      d.appendChild(champPiece(p, 'quantite', 'Qté', 'number'));
      var r = champPiece(p, 'remarques', 'Remarques', 'text'); r.className = 'remarque'; d.appendChild(r);
      var x = document.createElement('button'); x.type = 'button'; x.className = 'retirer'; x.textContent = '×'; x.setAttribute('aria-label', 'Retirer la pièce');
      x.addEventListener('click', function () { etat.pieces.splice(i, 1); afficherPieces(); modifie(); });
      d.appendChild(x); c.appendChild(d);
    });
  }
  function champPiece(p, cle, ph, type) {
    var i = document.createElement('input'); i.type = type; i.placeholder = ph; i.setAttribute('aria-label', ph); i.value = p[cle] || '';
    if (type === 'number') i.min = '1';
    i.addEventListener('input', function () { p[cle] = i.value; modifie(); });
    return i;
  }

  function charge() {
    var d = { action: 'generer', meta: {}, articles: etat.articles, operations: etat.operations, pieces: etat.pieces };
    CHAMPS.forEach(function (c) {
      var v = $(c).value;
      if (c === 'resultat' || c === 'observation') d[c] = v; else d.meta[c] = v;
    });
    return d;
  }

  function compter() {
    var n = 0;
    Object.keys(etat.operations).forEach(function (k) { if (etat.operations[k].statut) n += 1; });
    $('compteur').textContent = n + ' / ' + totalOps + ' opérations';
    $('jauge').style.width = (totalOps ? n * 100 / totalOps : 0) + '%';
  }
  function modifie() {
    compter();
    var c = charge(); ecrire(CLE_BROUILLON, c);
    $('etat-envoi').textContent = 'Brouillon sauvegardé';
  }

  function controler() {
    var e = [], premier = null;
    function marque(el, texte) { el.classList.add('invalide'); e.push(texte); premier = premier || el; }
    ['marche', 'societe', 'intervenants', 'charge_suivi', 'date', 'heure_debut', 'heure_fin', 'annee', 'etat', 'resultat'].forEach(function (c) {
      var el = $(c); el.classList.remove('invalide');
      if (!el.value.trim()) marque(el, el.parentNode.firstChild.textContent.trim() + ' : champ obligatoire');
    });
    if ($('heure_debut').value && $('heure_fin').value && $('heure_fin').value <= $('heure_debut').value) marque($('heure_fin'), "L'heure de fin doit suivre l'heure de début");
    if (!etat.articles.length) { e.push('Sélectionnez au moins un article'); premier = premier || $('articles'); }
    modele.sections.forEach(function (s) {
      s.operations.forEach(function (o) {
        var r = etat.operations[o.id], d = $('ligne-' + o.id);
        d.classList.remove('a-revoir');
        if (!r.statut) { d.classList.add('a-revoir'); e.push('Sans réponse : ' + o.libelle); premier = premier || d; }
        else if (r.statut === 'non_fait' && !(r.remarque || '').trim()) { var i = d.querySelector('input'); marque(i, 'Motif obligatoire : ' + o.libelle); }
      });
    });
    if (premier && premier.focus && premier.tagName !== 'DIV') premier.focus();
    return e;
  }

  function bloquer(v, texte) {
    enCours = v;
    $('btn-pdf').disabled = v; $('btn-imprimer').disabled = v;
    if (texte) $('etat-envoi').textContent = texte;
  }

  async function obtenir() {
    var e = controler();
    if (e.length) { message('erreur', e.length + ' point(s) à corriger', e.slice(0, 8)); return null; }
    var d = charge(), cle = JSON.stringify(d);
    if (dernier && dernier.cle === cle) return dernier;
    bloquer(true, 'Création du rapport…');
    try {
      var ctrl = new AbortController();
      var limite = setTimeout(function () { ctrl.abort(); }, 90000);
      var rep = await fetch(BASE, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: cle, signal: ctrl.signal });
      clearTimeout(limite);
      var r = await rep.json();
      if (!r.ok) { message('erreur', 'Rapport refusé', r.erreurs || []); return null; }
      dernier = { cle: cle, reference: r.reference, html: r.html, pdf: r.pdf_base64 };
      message('succes', 'Rapport ' + r.reference + ' enregistré au registre.');
      return dernier;
    } catch (err) {
      message('erreur', "Envoi impossible : vérifiez le réseau puis réessayez. Votre saisie reste sur cet appareil.");
      return null;
    } finally {
      bloquer(false, 'Brouillon sauvegardé');
    }
  }

  function telecharger(r) {
    var bin = atob(r.pdf), n = bin.length, tab = new Uint8Array(n);
    for (var i = 0; i < n; i += 1) tab[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([tab], { type: 'application/pdf' }));
    var a = document.createElement('a'); a.href = url; a.download = r.reference + '.pdf';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
  }

  function imprimer(r) {
    var ancien = $('cadre-impression'); if (ancien) ancien.remove();
    var f = document.createElement('iframe'); f.id = 'cadre-impression'; f.title = 'Impression du rapport';
    f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;';
    f.onload = function () { f.contentWindow.focus(); f.contentWindow.print(); };
    f.srcdoc = r.html;
    document.body.appendChild(f);
  }

  function nouveau() {
    effacer(CLE_BROUILLON);
    window.location.reload();
  }

  function restaurer() {
    var b = lire(CLE_BROUILLON);
    if (b) {
      etat.articles = (b.articles || []).filter(function (a) { return modele.articles.indexOf(a) >= 0; });
      etat.operations = b.operations || {};
      etat.pieces = Array.isArray(b.pieces) ? b.pieces : [];
    }
    construire();
    if (b) {
      CHAMPS.forEach(function (c) {
        var v = (c === 'resultat' || c === 'observation') ? b[c] : (b.meta || {})[c];
        if (v !== undefined && v !== null) $(c).value = v;
      });
    } else {
      var d = aujourdhui();
      $('date').value = d; $('trimestre').value = trimestreDe(d); $('annee').value = d.slice(0, 4);
    }
    compter();
  }

  async function demarrer() {
    try {
      var rep = await fetch(BASE + '/modele');
      var r = await rep.json();
      if (!r.ok || !r.modele) throw new Error('modele');
      modele = r.modele; ecrire(CLE_MODELE, modele);
    } catch (e) {
      modele = lire(CLE_MODELE);
      if (!modele) { $('chargement').textContent = 'Modèle indisponible : vérifiez le réseau puis rechargez la page.'; return; }
      message('', 'Hors ligne : modèle enregistré utilisé. La saisie reste possible, le PDF demandera du réseau.');
    }
    restaurer();
    $('chargement').hidden = true; $('form').hidden = false;
    CHAMPS.forEach(function (c) {
      $(c).addEventListener('input', function () { $(c).classList.remove('invalide'); modifie(); });
    });
    $('date').addEventListener('change', function () {
      var d = $('date').value;
      if (d) { $('trimestre').value = trimestreDe(d); $('annee').value = d.slice(0, 4); modifie(); }
    });
    $('ajout-piece').addEventListener('click', function () { etat.pieces.push({ designation: '', quantite: '1', remarques: '' }); afficherPieces(); modifie(); });
    $('nouveau').addEventListener('click', nouveau);
    $('btn-pdf').addEventListener('click', async function () { if (enCours) return; var r = await obtenir(); if (r) telecharger(r); });
    $('btn-imprimer').addEventListener('click', async function () { if (enCours) return; var r = await obtenir(); if (r) imprimer(r); });
  }

  $('form').addEventListener('submit', function (e) { e.preventDefault(); });
  demarrer();
})();
</script>
</body>
</html>
