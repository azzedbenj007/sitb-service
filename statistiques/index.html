<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Statistiques du service SITB | Hôpital des Enfants</title>
<style>
  :root {
    --fond: #f3f6fb; --panneau: #ffffff; --bord: #c9d5e4; --bord-doux: #e3eaf3;
    --texte: #16243a; --doux: #55647a; --pale: #8693a6; --bleu: #1565d8; --bleu-fort: #1258c0;
    --vert: #157a4f; --rouge: #c8303a;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
    --st-bon: #0ca30c; --st-attention: #fab219; --st-serieux: #ec835a; --st-critique: #d03b3b;
    --neutre: #b7c3d3;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--fond); color: var(--texte); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  a { color: var(--bleu-fort); }
  button, input, select { font: inherit; }
  input, select { min-height: 44px; padding: 8px 10px; border: 1px solid var(--bord); border-radius: 7px; background: #fff; color: var(--texte); width: 100%; }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--bleu); outline-offset: 1px; }
  .btn { min-height: 44px; padding: 0 16px; border-radius: 7px; border: 1px solid var(--bleu); background: var(--bleu); color: #fff; font-weight: 700; cursor: pointer; }
  .btn.sec { background: #fff; color: var(--bleu-fort); }
  .btn:disabled { opacity: .55; cursor: wait; }
  .lien-btn { background: none; border: 0; color: var(--bleu-fort); font-weight: 600; cursor: pointer; padding: 8px 4px; min-height: 44px; }

  /* Connexion */
  #connexion { max-width: 440px; margin: 0 auto; padding: 40px 16px; }
  .carte { background: var(--panneau); border: 1px solid var(--bord); border-radius: 12px; padding: 20px; }
  .surtitre { color: var(--bleu-fort); font-size: 13px; font-weight: 600; letter-spacing: .04em; }
  h1 { font-size: 23px; line-height: 1.2; margin: 4px 0 8px; }
  .aide { color: var(--doux); font-size: 14px; margin: 0 0 14px; }
  .onglets-cx { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--bord); border-radius: 8px; overflow: hidden; margin: 16px 0; }
  .onglets-cx button { min-height: 44px; border: 0; background: #eef2f8; color: var(--doux); font-weight: 600; cursor: pointer; }
  .onglets-cx button[aria-selected="true"] { background: var(--bleu); color: #fff; }
  label.champ { display: block; font-size: 14px; color: var(--doux); margin-bottom: 12px; }
  label.champ input { margin-top: 4px; }
  .msg { margin-top: 12px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--bord); font-size: 14px; }
  .msg.erreur { border-color: var(--rouge); color: #8e1f27; background: #fdf3f4; }
  .msg.ok { border-color: var(--vert); color: #0f5a3a; background: #f0f8f4; }

  /* Tableau de bord */
  header.haut { background: var(--panneau); border-bottom: 1px solid var(--bord); position: sticky; top: 0; z-index: 20; }
  .haut-int { max-width: 1280px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .haut-int .titre { flex: 1 1 260px; min-width: 0; }
  .haut-int h1 { font-size: 19px; margin: 0; }
  .haut-int .meta { color: var(--doux); font-size: 13px; }
  .haut-int .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  nav.onglets { max-width: 1280px; margin: 0 auto; padding: 0 16px 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  nav.onglets button { min-height: 40px; padding: 0 12px; border: 1px solid var(--bord); border-radius: 20px; background: #fff; color: var(--doux); font-weight: 600; font-size: 14px; cursor: pointer; }
  nav.onglets button[aria-selected="true"] { background: var(--texte); border-color: var(--texte); color: #fff; }
  main { max-width: 1280px; margin: 0 auto; padding: 14px 16px 60px; }
  .filtres { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-bottom: 14px; }
  .filtres label { font-size: 13px; color: var(--doux); flex: 1 1 150px; max-width: 260px; }
  .filtres label.large { flex: 1 1 240px; max-width: none; }
  .filtres input, .filtres select { margin-top: 3px; }
  .periode { display: flex; flex-wrap: wrap; gap: 6px; }
  .periode button { min-height: 40px; padding: 0 12px; border: 1px solid var(--bord); border-radius: 7px; background: #fff; color: var(--doux); font-weight: 600; font-size: 14px; cursor: pointer; }
  .periode button[aria-pressed="true"] { border-color: var(--bleu); color: var(--bleu-fort); background: #eaf2fd; }
  .bandeau-periode { font-size: 13px; color: var(--doux); margin: -6px 0 12px; }

  .tuiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .tuile { background: var(--panneau); border: 1px solid var(--bord); border-radius: 10px; padding: 12px 14px; min-width: 0; }
  .tuile .lib { color: var(--doux); font-size: 13px; }
  .tuile .val { font-size: 26px; font-weight: 700; line-height: 1.15; margin-top: 2px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .tuile .sous { color: var(--pale); font-size: 12.5px; margin-top: 2px; }
  .tuile.alerte { border-left: 4px solid var(--st-critique); }
  .tuile.attention { border-left: 4px solid var(--st-attention); }
  .tuile.bon { border-left: 4px solid var(--st-bon); }

  .grille { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 12px; margin-bottom: 14px; }
  .bloc { background: var(--panneau); border: 1px solid var(--bord); border-radius: 10px; padding: 14px; min-width: 0; }
  .bloc.plein { grid-column: 1 / -1; }
  .bloc h2 { font-size: 15px; margin: 0 0 2px; }
  .bloc .note { color: var(--doux); font-size: 12.5px; margin: 0 0 10px; }
  .vide { color: var(--pale); font-size: 14px; padding: 18px 0; text-align: center; }

  /* Barres horizontales */
  .barres { display: grid; gap: 6px; }
  .barre { display: grid; grid-template-columns: minmax(90px, 38%) 1fr auto; gap: 8px; align-items: center; font-size: 13.5px; cursor: default; }
  .barre .nom { color: var(--texte); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .barre .piste { height: 14px; display: flex; gap: 2px; }
  .barre .seg { height: 100%; border-radius: 0 4px 4px 0; min-width: 2px; }
  .barre .seg + .seg { border-radius: 0; }
  .barre .seg:last-child { border-radius: 0 4px 4px 0; }
  .barre .nb { color: var(--doux); font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; }
  .barre:hover .nom { color: var(--bleu-fort); }
  .plus { margin-top: 6px; }

  /* Colonnes */
  .colonnes { position: relative; }
  .colonnes svg { display: block; width: 100%; height: auto; overflow: visible; }
  .colonnes .axe { stroke: var(--bord-doux); }
  .colonnes text { fill: var(--doux); font-size: 12px; }
  .legende { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--doux); margin: 0 0 8px; }
  .legende span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; background: var(--c); }

  #infobulle { position: fixed; z-index: 50; pointer-events: none; background: #16243a; color: #fff; font-size: 12.5px; padding: 7px 9px; border-radius: 6px; max-width: 280px; box-shadow: 0 4px 14px rgba(0,0,0,.2); }
  #infobulle b { display: block; margin-bottom: 2px; }

  /* Tables */
  .table-outils { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  .table-outils input { flex: 1 1 220px; width: auto; }
  .table-outils .compte { color: var(--doux); font-size: 13px; }
  .table-zone { overflow-x: auto; border: 1px solid var(--bord-doux); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--bord-doux); vertical-align: top; }
  th { background: #f6f8fc; color: var(--doux); font-weight: 600; font-size: 12.5px; cursor: pointer; white-space: nowrap; position: sticky; top: 0; }
  th[aria-sort="ascending"]::after { content: " ▲"; font-size: 10px; }
  th[aria-sort="descending"]::after { content: " ▼"; font-size: 10px; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td .court { display: block; min-width: 150px; max-width: 420px; }
  td { white-space: normal; } td:not(:has(.court)) { white-space: nowrap; }
  tbody tr:hover { background: #f8fafd; }
  .pagination { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 8px; font-size: 13px; color: var(--doux); }
  .puce { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; font-size: 12.5px; }
  .puce::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--neutre)); }

  .echeances { display: grid; gap: 6px; }
  .echeance { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 13.5px; padding: 7px 0; border-bottom: 1px solid var(--bord-doux); }
  .echeance:last-child { border-bottom: 0; }
  .echeance small { color: var(--doux); grid-column: 1 / -1; }
  .jours { font-weight: 700; font-variant-numeric: tabular-nums; }

  .sources { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
  .source { border: 1px solid var(--bord-doux); border-radius: 8px; padding: 8px 10px; font-size: 13.5px; }
  .source .etat { font-size: 12.5px; }
  #chargement { max-width: 1280px; margin: 40px auto; text-align: center; color: var(--doux); }
  .roue { width: 34px; height: 34px; border: 3px solid var(--bord); border-top-color: var(--bleu); border-radius: 50%; margin: 0 auto 12px; animation: tourne 1s linear infinite; }
  @keyframes tourne { to { transform: rotate(360deg); } }
  #alerte-globale { max-width: 1280px; margin: 10px auto 0; padding: 0 16px; }
  @media (max-width: 760px) { header.haut { position: static; } }
  @media (max-width: 560px) {
    .barre { grid-template-columns: minmax(80px, 42%) 1fr auto; }
    .tuile .val { font-size: 22px; }
    .haut-int h1 { font-size: 17px; }
  }
  @media print {
    header.haut { position: static; }
    nav.onglets, .actions, .filtres, .table-outils, .pagination { display: none !important; }
    body { background: #fff; }
  }
</style>
</head>
<body>

<!-- Connexion -->
<section id="connexion" hidden>
  <div class="carte">
    <div class="surtitre">SITB · HÔPITAL DES ENFANTS · GST-RSK</div>
    <h1>Statistiques du service</h1>
    <p class="aide">Accès réservé aux membres de l'annuaire du service SITB.</p>
    <div class="onglets-cx" role="tablist">
      <button type="button" role="tab" id="t-telegram" aria-selected="true">Code Telegram</button>
      <button type="button" role="tab" id="t-mdp" aria-selected="false">Mot de passe</button>
    </div>
    <form id="f-telegram" autocomplete="off">
      <label class="champ">Votre nom (tel qu'inscrit dans l'annuaire)
        <input id="nom" name="nom" placeholder="Ex. Siti_ayoub" autocomplete="username" required>
      </label>
      <div id="bloc-code" hidden>
        <label class="champ">Code reçu sur Telegram (bot NOVA)
          <input id="code" name="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="6 chiffres" autocomplete="one-time-code">
        </label>
      </div>
      <button class="btn" id="btn-telegram" type="submit" style="width:100%">Recevoir un code</button>
      <button class="lien-btn" id="btn-renvoyer" type="button" hidden>Demander un nouveau code</button>
    </form>
    <form id="f-mdp" hidden>
      <label class="champ">Mot de passe
        <input id="mdp" type="password" autocomplete="current-password" required>
      </label>
      <button class="btn" type="submit" style="width:100%">Se connecter</button>
    </form>
    <div id="msg-cx" class="msg" hidden></div>
  </div>
</section>

<!-- Application -->
<div id="appli" hidden>
  <header class="haut">
    <div class="haut-int">
      <div class="titre">
        <h1>Statistiques du service SITB</h1>
        <div class="meta" id="meta"></div>
      </div>
      <div class="actions">
        <button class="btn sec" id="btn-actualiser" type="button">Actualiser les données</button>
        <button class="btn sec" id="btn-imprimer" type="button">Imprimer</button>
        <button class="btn sec" id="btn-sortir" type="button">Déconnexion</button>
      </div>
    </div>
    <nav class="onglets" id="onglets" role="tablist"></nav>
  </header>
  <div id="alerte-globale"></div>
  <div id="chargement" hidden><div class="roue"></div><div id="chargement-txt">Chargement des statistiques…</div></div>
  <main id="contenu"></main>
</div>
<div id="infobulle" hidden></div>

<script>
(function () {
  'use strict';
  var BASE = 'https://n8n.srv881398.hstgr.cloud/webhook/stats-sitb';
  var CLE = 'sitb_stats_session';
  var $ = function (id) { return document.getElementById(id); };
  var etat = { session: null, donnees: null, sources: {}, maj: '', onglet: 'synthese', periode: '12m', du: '', au: '', filtres: {} };

  // ---------- utilitaires ----------
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function norm(s) { return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  var nf = new Intl.NumberFormat('fr-FR');
  function nb(n) { return n == null || isNaN(n) ? '—' : nf.format(Math.round(n)); }
  function dh(n) { if (n == null || isNaN(n)) return '—'; if (Math.abs(n) >= 1e6) return (n / 1e6).toLocaleString('fr-FR', { maximumFractionDigits: 2 }) + ' M DH'; if (Math.abs(n) >= 1e4) return Math.round(n / 1e3).toLocaleString('fr-FR') + ' k DH'; return nf.format(Math.round(n)) + ' DH'; }
  function pct(a, b) { return b ? Math.round(a * 100 / b) + ' %' : '—'; }
  function dfr(iso) { if (!iso) return ''; var p = iso.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
  function aujourdhui() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function ajouterJours(iso, n) { var d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
  function joursEntre(a, b) { return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000); }
  var MOIS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
  function moisLib(ym) { var p = ym.split('-'); return MOIS[+p[1] - 1] + ' ' + p[0].slice(2); }
  function compter(liste, f) { var c = {}; liste.forEach(function (x) { var v = typeof f === 'function' ? f(x) : x[f]; (Array.isArray(v) ? v : [v]).forEach(function (k) { k = k || 'Non renseigné'; c[k] = (c[k] || 0) + 1; }); }); return c; }
  function sommer(liste, f, g) { var c = {}; liste.forEach(function (x) { var k = (typeof f === 'function' ? f(x) : x[f]) || 'Non renseigné'; c[k] = (c[k] || 0) + (g(x) || 0); }); return c; }
  function versListe(c) { return Object.keys(c).map(function (k) { return { nom: k, val: c[k] }; }).sort(function (a, b) { return b.val - a.val; }); }
  function uniques(liste, f) { var s = {}; liste.forEach(function (x) { var v = x[f]; if (v) s[v] = 1; }); return Object.keys(s).sort(function (a, b) { return a.localeCompare(b, 'fr'); }); }
  function personnes(v) { return String(v || '').split(' + ').filter(Boolean); }
  function lireSession() { try { var s = JSON.parse(localStorage.getItem(CLE) || 'null'); return s && s.jeton ? s : null; } catch (e) { return null; } }
  function garderSession(s) { try { if (s) localStorage.setItem(CLE, JSON.stringify(s)); else localStorage.removeItem(CLE); } catch (e) {} }

  async function appel(corps, delai) {
    var ctrl = new AbortController(), t = setTimeout(function () { ctrl.abort(); }, delai || 30000);
    try {
      var r = await fetch(BASE, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corps), signal: ctrl.signal });
      var txt = await r.text(), j = null;
      try { j = JSON.parse(txt); } catch (e) { throw new Error('Réponse inattendue du serveur (' + r.status + ').'); }
      return j || {};
    } catch (e) {
      if (e.name === 'AbortError') throw new Error('Le serveur met trop de temps à répondre. Réessayez.');
      if (e instanceof TypeError) throw new Error('Serveur injoignable. Vérifiez la connexion internet.');
      throw e;
    } finally { clearTimeout(t); }
  }

  // ---------- connexion ----------
  function messageCx(texte, type) { var m = $('msg-cx'); m.hidden = !texte; m.className = 'msg ' + (type || ''); m.textContent = texte || ''; }
  function ongletCx(mdp) {
    $('t-telegram').setAttribute('aria-selected', String(!mdp)); $('t-mdp').setAttribute('aria-selected', String(mdp));
    $('f-telegram').hidden = mdp; $('f-mdp').hidden = !mdp; messageCx('');
    (mdp ? $('mdp') : $('nom')).focus();
  }
  $('t-telegram').onclick = function () { ongletCx(false); };
  $('t-mdp').onclick = function () { ongletCx(true); };
  var codeDemande = false;
  async function demanderCode() {
    var nom = $('nom').value.trim(); if (nom.length < 3) { messageCx('Saisissez votre nom.', 'erreur'); return; }
    $('btn-telegram').disabled = true;
    try {
      var r = await appel({ action: 'code', nom: nom });
      if (!r.ok) { messageCx(r.erreur || 'Envoi impossible.', 'erreur'); return; }
      codeDemande = true; $('bloc-code').hidden = false; $('btn-renvoyer').hidden = false; $('btn-telegram').textContent = 'Se connecter';
      messageCx(r.message, 'ok'); $('code').focus();
    } catch (e) { messageCx(e.message, 'erreur'); } finally { $('btn-telegram').disabled = false; }
  }
  $('btn-renvoyer').onclick = demanderCode;
  $('nom').addEventListener('input', function () { if (codeDemande) { codeDemande = false; $('bloc-code').hidden = true; $('btn-renvoyer').hidden = true; $('btn-telegram').textContent = 'Recevoir un code'; $('code').value = ''; } });
  $('f-telegram').onsubmit = async function (ev) {
    ev.preventDefault();
    if (!codeDemande) return demanderCode();
    var code = $('code').value.replace(/\D/g, ''); if (code.length !== 6) { messageCx('Le code contient 6 chiffres.', 'erreur'); return; }
    $('btn-telegram').disabled = true;
    try {
      var r = await appel({ action: 'verifier', nom: $('nom').value.trim(), code: code });
      if (!r.ok) { messageCx(r.erreur || 'Connexion refusée.', 'erreur'); return; }
      ouvrir(r);
    } catch (e) { messageCx(e.message, 'erreur'); } finally { $('btn-telegram').disabled = false; }
  };
  $('f-mdp').onsubmit = async function (ev) {
    ev.preventDefault();
    var b = ev.submitter || this.querySelector('button'); b.disabled = true;
    try {
      var r = await appel({ action: 'mdp', mot_de_passe: $('mdp').value });
      $('mdp').value = '';
      if (!r.ok) { messageCx(r.erreur || 'Connexion refusée.', 'erreur'); return; }
      ouvrir(r);
    } catch (e) { messageCx(e.message, 'erreur'); } finally { b.disabled = false; }
  };
  function ouvrir(r) { etat.session = { jeton: r.jeton, role: r.role, nom: r.nom }; garderSession(etat.session); demarrer(); }
  function deconnecter(msg) {
    etat.session = null; etat.donnees = null; garderSession(null);
    $('appli').hidden = true; $('connexion').hidden = false; codeDemande = false; $('bloc-code').hidden = true; $('btn-renvoyer').hidden = true; $('btn-telegram').textContent = 'Recevoir un code';
    messageCx(msg || '', msg ? 'erreur' : '');
  }
  $('btn-sortir').onclick = function () { deconnecter(''); };
  $('btn-imprimer').onclick = function () { window.print(); };

  // ---------- chargement ----------
  async function charger(action) {
    $('chargement').hidden = false; $('contenu').hidden = true;
    $('chargement-txt').textContent = action === 'actualiser' ? 'Lecture de tous les registres du service… (environ 20 secondes)' : 'Chargement des statistiques…';
    $('btn-actualiser').disabled = true;
    try {
      var r = await appel({ action: action, jeton: etat.session.jeton }, action === 'actualiser' ? 120000 : 45000);
      if (r.session === false) return deconnecter(r.erreur);
      if (!r.ok && r.vide && action !== 'actualiser') return charger('actualiser');
      if (!r.ok) throw new Error(r.erreur || 'Chargement impossible.');
      etat.donnees = r.donnees || {}; etat.sources = r.sources || {}; etat.maj = r.maj || '';
      etat.session.role = r.role || etat.session.role; etat.session.nom = r.nom || etat.session.nom;
      $('alerte-globale').innerHTML = '';
      var ko = Object.keys(etat.sources).filter(function (k) { return !etat.sources[k].ok; });
      if (ko.length) $('alerte-globale').innerHTML = '<div class="msg erreur">' + ko.length + ' source(s) n\'ont pas pu être lues lors de la dernière mise à jour : ' + esc(ko.map(libSource).join(', ')) + '. Voir l\'onglet « Sources ».</div>';
      afficher();

      bloc('Liste des anomalies', table('ano', [{ k: 'date', l: 'Date', f: dfr }, { k: 'id', l: 'Id' }, { k: 'anomalie', l: 'Anomalie' }, { k: 'gravite', l: 'Gravité', h: puce, csv: function (v) { return v; } }, { k: 'domaine', l: 'Domaine' }, { k: 'service', l: 'Service' }, { k: 'equip', l: 'Installation' }, { k: 'resp', l: 'Responsable' }, { k: 'statut', l: 'Statut' }, { k: 'decision', l: 'Décision' }, { k: 'echeance', l: 'Échéance', f: dfr }, { k: 'photo', l: 'Photo', h: lienCol, csv: function (v) { return v; } }], l, { tri: 'date', sens: -1, nom: 'anomalies' }), '', true) + '</div>';
    return h;
  };

  // ===== Équipements =====
  VUES.equipements = function () {

    var tous = D('equipements');
    var l = appliquerFiltres(tous, [['e_cat', 'cat'], ['e_serv', 'service'], ['e_etat', 'etat'], ['e_src', 'source']]);
    var h = '<div class="filtres">' + selectFiltre('e_cat', 'Catégorie', uniques(tous, 'cat')) + selectFiltre('e_serv', 'Service / local', uniques(tous, 'service')) + selectFiltre('e_etat', 'État physique', uniques(tous, 'etat')) + selectFiltre('e_src', 'Source', uniques(tous, 'source')) + '</div>';
    h += '<div class="tuiles">' + tuile('Équipements', nb(l.length), uniques(l, 'cat').length + ' catégories') + tuile('Services / locaux', nb(uniques(l, 'service').length)) +
      tuile('Sans N° d\'inventaire', nb(l.filter(function (x) { return !x.inv; }).length), pct(l.filter(function (x) { return !x.inv; }).length, l.length), 'attention') + tuile('Sans N° de série', nb(l.filter(function (x) { return !x.serie; }).length), pct(l.filter(function (x) { return !x.serie; }).length, l.length)) +
      tuile('Fiches incomplètes', nb(l.filter(function (x) { return !x.des || !x.service; }).length), 'sans désignation ou sans service') + '</div>';
    h += '<div class="grille">' + bloc('Par catégorie', barres(versListe(compter(l, 'cat')), { max: 20 })) + bloc('Par service / local', barres(versListe(compter(l, 'service')), { max: 20 })) +
      bloc('Par état physique', barres(versListe(compter(l, function (x) { return x.etat || 'Non renseigné'; })), { couleur: function (n) { return /bon|service/i.test(n) ? 'var(--st-bon)' : /moyen/i.test(n) ? 'var(--st-attention)' : /mauvais|panne|hors/i.test(n) ? 'var(--st-critique)' : 'var(--neutre)'; } })) +
      bloc('Saisies par mois', colonnesMois(l.filter(function (x) { return x.date; }), 'date', null), 'Date d\'ajout à l\'inventaire (filtre de période sans effet ici si « Tout »).') +
      bloc('Inventaire', table('equip', [{ k: 'cat', l: 'Catégorie' }, { k: 'des', l: 'Désignation' }, { k: 'service', l: 'Service / local' }, { k: 'empl', l: 'Emplacement' }, { k: 'inv', l: 'N° inventaire' }, { k: 'serie', l: 'N° série' }, { k: 'etat', l: 'État' }, { k: 'source', l: 'Source' }], l, { tri: 'cat', sens: 1, nom: 'equipements' }), '', true) + '</div>';
    return h;
  };

  // ===== Rapports préventifs =====
  VUES.rapports = function () {

    var tous = D('rapports');
    var lf = appliquerFiltres(tous, [['r_fam', 'famille'], ['r_soc', 'soc']]);
    var l = dansPeriode(lf);
    var nf_ = l.reduce(function (s, r) { return s + (r.non_faites || 0); }, 0), f_ = l.reduce(function (s, r) { return s + (r.faites || 0); }, 0);
    var h = selecteurPeriode() + '<div class="filtres">' + selectFiltre('r_fam', 'Famille de contrat', uniques(tous, 'famille')) + selectFiltre('r_soc', 'Société', uniques(tous, 'soc')) + '</div>';
    h += '<div class="tuiles">' + tuile('Rapports (période)', nb(l.length), nb(lf.length) + ' au total') + tuile('Familles actives', nb(uniques(l, 'famille').length), 'sur 13 sites de rapports') +
      tuile('Opérations faites', nb(f_), pct(f_, f_ + nf_) + ' des opérations prévues', 'bon') + tuile('Opérations non faites', nb(nf_), '', nf_ ? 'attention' : 'bon') +
      tuile('Rapports avec pièces changées', nb(l.filter(function (r) { return r.pieces; }).length)) + '</div>';
    h += '<div class="grille">' + bloc('Rapports par mois', colonnesMois(l, 'date', 'famille')) + bloc('Par famille de contrat', barres(versListe(compter(l, 'famille')), { max: 13, sansAutres: true })) +
      bloc('Opérations non faites par famille', barres(versListe(sommer(l, 'famille', function (r) { return r.non_faites; })).filter(function (x) { return x.val > 0; }), { couleur: function () { return 'var(--st-serieux)'; } })) +
      bloc('Par société titulaire', barres(versListe(compter(l, 'soc')))) +
      bloc('Registre des rapports', table('rap', [{ k: 'date', l: 'Date', f: dfr }, { k: 'ref', l: 'Référence' }, { k: 'famille', l: 'Famille' }, { k: 'marche', l: 'Marché' }, { k: 'soc', l: 'Société' }, { k: 'trimestre', l: 'Trimestre' }, { k: 'faites', l: 'Faites', num: true }, { k: 'non_faites', l: 'Non faites', num: true }, { k: 'resultat', l: 'Résultat' }, { k: 'pieces', l: 'Pièces changées' }, { k: 'lien', l: 'PDF', h: lienCol, csv: function (v) { return v; } }], l, { tri: 'date', sens: -1, nom: 'rapports_preventifs' }), '', true) + '</div>';
    return h;
  };

  // ===== Équipe =====
  VUES.equipe = function () {

    var a = aujourdhui(), membres = D('equipe').map(function (m) { return m.nom; });
    var tP = dansPeriode(D('taches')), iP = dansPeriode(D('interventions')), aP = dansPeriode(D('anomalies')), rec = etat.session.role === 'admin' ? dansPeriode(D('reclamations')) : null;
    var lignes = membres.map(function (n) {
      var t = tP.filter(function (x) { return personnes(x.assigne).indexOf(n) >= 0; }), nonAnn = t.filter(function (x) { return x.statut !== 'Annulée'; }), term = t.filter(function (x) { return x.statut === 'Terminée'; });
      var actAll = D('taches').filter(function (x) { return tacheOuverte(x) && personnes(x.assigne).indexOf(n) >= 0; });
      var o = { nom: n, taches: t.length, terminees: term.length, taux: nonAnn.length ? Math.round(term.length * 100 / nonAnn.length) : null, actives: actAll.length, depassees: actAll.filter(function (x) { return x.echeance && x.echeance < a; }).length,
        interventions: iP.filter(function (x) { return personnes(x.qui).indexOf(n) >= 0; }).length, anomalies: aP.filter(function (x) { return personnes(x.resp).indexOf(n) >= 0; }).length,
        cm: D('contrats').filter(function (c) { return c.statut === 'En cours' && personnes(c.agent).indexOf(n) >= 0; }).length, ct: D('travaux').filter(function (c) { return c.statut === 'En cours' && personnes(c.agent).indexOf(n) >= 0; }).length };
      if (rec) o.reclamations = rec.filter(function (x) { return personnes(x.qui).indexOf(n) >= 0; }).length;
      return o;
    });
    var cols = [{ k: 'nom', l: 'Membre' }, { k: 'taches', l: 'Tâches (période)', num: true }, { k: 'terminees', l: 'Terminées', num: true }, { k: 'taux', l: 'Taux d\'achèvement', num: true, f: function (v) { return v == null ? '—' : v + ' %'; }, csv: function (v) { return v == null ? '' : v; } }, { k: 'actives', l: 'Actives', num: true }, { k: 'depassees', l: 'Échéance dépassée', num: true }, { k: 'interventions', l: 'Interventions', num: true }, { k: 'anomalies', l: 'Anomalies à analyser', num: true }, { k: 'cm', l: 'CM suivis en cours', num: true }, { k: 'ct', l: 'CT suivis en cours', num: true }];
    if (rec) cols.push({ k: 'reclamations', l: 'Réclamations', num: true });
    var h = selecteurPeriode() + '<div class="grille">' +
      bloc('Tableau de l\'équipe', table('equipe', cols, lignes, { tri: 'taches', sens: -1, nom: 'equipe' }), 'Membres de l\'annuaire. Les tâches, interventions et anomalies suivent la période choisie ; les contrats suivis sont ceux en cours.', true) +
      bloc('Taux d\'achèvement des tâches', barres(lignes.filter(function (x) { return x.taux != null; }).map(function (x) { return { nom: x.nom, val: x.taux }; }).sort(function (a, b) { return b.val - a.val; }), { format: function (v) { return v + ' %'; }, sansAutres: true, max: 20 }), 'Tâches terminées / tâches non annulées sur la période.') +
      bloc('Interventions saisies', barres(lignes.map(function (x) { return { nom: x.nom, val: x.interventions }; }).filter(function (x) { return x.val; }).sort(function (a, b) { return b.val - a.val; }), { sansAutres: true, max: 20 })) +
      bloc('Contrats suivis (en cours)', barresEmpilees(lignes.map(function (x) { return { nom: x.nom, parts: { 'CM (MM/BCM)': x.cm, 'CT (MT/BCT)': x.ct } }; }).filter(function (x) { return x.parts['CM (MM/BCM)'] + x.parts['CT (MT/BCT)']; }).sort(function (a, b) { return (b.parts['CM (MM/BCM)'] + b.parts['CT (MT/BCT)']) - (a.parts['CM (MM/BCM)'] + a.parts['CT (MT/BCT)']); }), ['CM (MM/BCM)', 'CT (MT/BCT)'], { max: 20 })) +
      bloc('Tâches actives par personne', barres(lignes.map(function (x) { return { nom: x.nom, val: x.actives }; }).filter(function (x) { return x.val; }).sort(function (a, b) { return b.val - a.val; }), { sansAutres: true, max: 20 }));
    if (rec) h += bloc('Réclamations du personnel (administrateur)', barres(versListe(compter(rec, 'qui')), { couleur: function () { return 'var(--st-serieux)'; } }) + '<div style="margin-top:12px">' + table('rec', [{ k: 'date', l: 'Date', f: dfr }, { k: 'qui', l: 'Personnel' }, { k: 'motif', l: 'Réclamation' }, { k: 'remarque', l: 'Remarque' }], rec, { tri: 'date', sens: -1, nom: 'reclamations' }) + '</div>', 'Visible uniquement par l\'administrateur.', true);
    return h + '</div>';
  };

  // ===== Besoins =====
  VUES.besoins = function () {

    var l = dansPeriode(D('besoins'));
    var h = selecteurPeriode() + '<div class="tuiles">' + tuile('Expressions de besoin (période)', nb(l.length), nb(D('besoins').length) + ' au total') + tuile('Services demandeurs', nb(uniques(l, 'service').length)) + '</div>';
    h += '<div class="grille">' + bloc('Par service', barres(versListe(compter(l, 'service')))) + bloc('Besoins exprimés', barres(versListe(compter(l, function (b) { return b.besoin; })))) +
      bloc('Liste des besoins', table('besoins', [{ k: 'date', l: 'Date', f: dfr }, { k: 'service', l: 'Service' }, { k: 'besoin', l: 'Besoin' }, { k: 'detail', l: 'Détails' }, { k: 'empl', l: 'Emplacement' }], l, { tri: 'date', sens: -1, nom: 'besoins' }), '', true) + '</div>';
    return h;
  };

  // ===== Sources =====
  var LIB = { contrats: 'Contrats de maintenance (MM/BCM)', travaux: 'Contrats de travaux (MT/BCT)', ged: 'GED (vue_agent)', taches: 'Gestion des tâches', interv_bot: 'Interventions (bot Nova_intervention)', interv_sitb: 'Interventions (NOVA)', anomalies: 'Anomalies_SITB', inventaire: 'Inventaire global', equipements_her: 'Registre équipements HER', reclamations: 'Réclamations du personnel', besoins: 'Expressions de besoin' };
  function libSource(k) { return LIB[k] || (k.indexOf('rp:') === 0 ? 'Rapports préventifs · ' + k.slice(3) : k); }
  VUES.sources = function () {

    var h = '<div class="grille">' + bloc('État des sources de données', '<div class="sources">' + Object.keys(etat.sources).map(function (k) { var s = etat.sources[k]; return '<div class="source"><b>' + esc(libSource(k)) + '</b><div class="etat">' + (s.ok ? puceTxt('var(--st-bon)', nb(s.lignes) + ' ligne(s) lue(s)') : puceTxt('var(--st-critique)', 'Échec : ' + s.erreur)) + '</div></div>'; }).join('') + '</div>', 'Les registres sont relus automatiquement toutes les 30 minutes. Le bouton « Actualiser les données » force une relecture immédiate.', true);
    if (etat.session.role === 'admin') h += bloc('Accès par mot de passe (administrateur)', formMdp(), 'La connexion par code Telegram reste toujours disponible pour les membres de l\'annuaire. Un mot de passe vide désactive ce mode de connexion.', true);
    return h + '</div>';
  };
  function puceTxt(c, t) { return '<span class="puce" style="--c:' + c + '">' + esc(t) + '</span>'; }
  function formMdp() {
    return '<form id="f-defmdp" class="filtres" style="margin:0"><label>Profil<select id="d-role"><option value="membre">Équipe (lecture, sans réclamations)</option><option value="admin">Administrateur</option></select></label><label class="large">Nouveau mot de passe (10 caractères minimum)<input id="d-mdp" type="password" autocomplete="new-password"></label><label style="flex:0 1 auto;display:flex;gap:8px;align-items:center;min-height:44px"><input id="d-tous" type="checkbox" style="width:20px;min-height:0">Déconnecter toutes les sessions</label><button class="btn" type="submit">Enregistrer</button></form><div id="msg-defmdp" class="msg" hidden></div>';
  }
  document.addEventListener('submit', async function (ev) {
    if (ev.target.id !== 'f-defmdp') return;
    ev.preventDefault();
    var m = $('msg-defmdp'), b = ev.target.querySelector('button'); b.disabled = true;
    try {
      var r = await appel({ action: 'definir_mdp', jeton: etat.session.jeton, role: $('d-role').value, mot_de_passe: $('d-mdp').value, deconnecter_tous: $('d-tous').checked });
      if (r.session === false) return deconnecter(r.erreur);
      m.hidden = false; m.className = 'msg ' + (r.ok ? 'ok' : 'erreur'); m.textContent = r.ok ? r.message : r.erreur;
      if (r.ok) { $('d-mdp').value = ''; if ($('d-tous').checked) setTimeout(function () { deconnecter('Toutes les sessions ont été fermées. Reconnectez-vous.'); }, 1500); }
    } catch (e) { m.hidden = false; m.className = 'msg erreur'; m.textContent = e.message; } finally { b.disabled = false; }
  });

  // ---------- démarrage ----------
  etat.session = lireSession();
  if (etat.session) demarrer(); else { $('connexion').hidden = false; }
})();
</script>
</body>
</html>
